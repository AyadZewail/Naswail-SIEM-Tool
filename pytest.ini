[pytest]
testpaths = tests
pythonpath = .
import_mode = importlib
markers =
    performance: performance and load tests (may be slower than unit tests)
    slow: tests that take more than a few seconds
    soak: extended stability tests (excluded from default runs)
    gui: full PyQt GUI tests (require display; excluded from default runs)
addopts = -m "not soak and not gui" --timeout=90
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
